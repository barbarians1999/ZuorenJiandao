name: publish-artifacts

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: 'Source desktop workflow run ID to publish completed artifacts from'
        required: true
        type: string
      tag:
        description: 'Release tag name (e.g. v0.3.1)'
        required: true
        type: string

permissions:
  actions: read
  contents: write

jobs:
  publish:
    name: Publish Completed Artifacts
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      RUN_ID: ${{ inputs.run_id }}
      TAG_NAME: ${{ inputs.tag }}
    steps:
      - name: Download completed desktop artifacts
        uses: actions/download-artifact@v7
        with:
          run-id: ${{ inputs.run_id }}
          github-token: ${{ github.token }}
          pattern: desktop-*
          path: release-files
          merge-multiple: true

      - name: Generate SHA-256 checksums
        working-directory: release-files
        shell: bash
        run: |
          set -euo pipefail
          ls -lh
          sha256sum ./* > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create or update release and verify digests
        shell: bash
        run: |
          set -euo pipefail
          if ! gh release view "$TAG_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$TAG_NAME" \
              --repo "$GITHUB_REPOSITORY" \
              --verify-tag \
              --generate-notes \
              --draft
          fi

          gh release upload "$TAG_NAME" \
            release-files/* \
            --repo "$GITHUB_REPOSITORY" \
            --clobber

          release_json="$(gh release view "$TAG_NAME" --repo "$GITHUB_REPOSITORY" --json isDraft,url,assets)"
          jq -r '.assets[] | [.name, (.digest // ""), .size] | @tsv' <<<"$release_json"

          for f in release-files/*; do
            name="${f##*/}"
            local_hash="sha256:$(sha256sum "$f" | cut -d ' ' -f1)"
            remote_hash="$(jq -r --arg n "$name" '.assets[] | select(.name == $n) | (.digest // "")' <<<"$release_json")"
            if [[ "$local_hash" != "$remote_hash" ]]; then
              echo "Digest mismatch for $name: local=$local_hash remote=$remote_hash" >&2
              exit 1
            fi
          done

          if [[ "$(jq -r '.isDraft' <<<"$release_json")" == "true" ]]; then
            gh release edit "$TAG_NAME" --repo "$GITHUB_REPOSITORY" --draft=false
          fi
          gh release view "$TAG_NAME" --repo "$GITHUB_REPOSITORY" --json url,isDraft,tagName,assets --jq '{url, isDraft, tagName, assets: [.assets[] | {name, size}]}'
