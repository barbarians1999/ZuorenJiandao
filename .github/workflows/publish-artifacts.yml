name: publish-artifacts

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: 'Source desktop workflow run ID to publish completed artifacts from'
        required: true
        type: string
      tag:
        description: 'Release tag name (e.g. v0.3.1)'
        required: true
        type: string

permissions:
  actions: read
  contents: write

jobs:
  publish:
    name: Publish Completed Artifacts
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      RUN_ID: ${{ inputs.run_id }}
      TAG_NAME: ${{ inputs.tag }}
    steps:
      - uses: actions/checkout@v7
      - name: Verify source run and tag
        shell: bash
        run: |
          set -euo pipefail
          expected=4412bad45f87c933722ca3f7384bd79a51b5e2bf
          test "$RUN_ID" = 44788013388
          test "$TAG_NAME" = v0.3.3
          test "$(gh run view "$RUN_ID" --repo "$GITHUB_REPOSITORY" --json headSha,conclusion --jq '.headSha + " " + .conclusion')" = "$expected success"
          tag_object="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG_NAME" --jq '.object.sha')"
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$tag_object" --jq '.object.sha')" = "$expected"

      - name: Download completed desktop artifacts
        uses: actions/download-artifact@v7
        with:
          run-id: ${{ inputs.run_id }}
          github-token: ${{ github.token }}
          pattern: desktop-*
          path: release-files
          merge-multiple: true

      - name: Upload only the verified missing assets
        shell: bash
        run: bash .github/upload-verified-0.3.3.sh
